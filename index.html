<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#176c43">
  <meta name="description" content="Jogo educativo Trilhas da Prevenção: Escolhas que Contam.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <title>Trilhas da Prevenção</title>
</head>
<body>
  <a class="skip-link" href="#app">Ir para o conteúdo principal</a>

  <noscript>
    <div class="noscript-message">
      Este aplicativo precisa do JavaScript ativado para controlar a partida.
    </div>
  </noscript>

  <main id="app" tabindex="-1" aria-busy="true"></main>

  <button id="global-voice-button" class="global-voice-button" type="button" data-action="open-settings" aria-label="Abrir configurações de leitura por voz">
    <span aria-hidden="true">🔊</span><span class="voice-status">Voz ativa</span>
  </button>

  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="live-region" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <script src="js/questions.js" defer></script>
  <script src="js/game.js" defer></script>
  <script src="js/accessibility.js" defer></script>
  <script src="js/app.js" defer></script>
</body>
</html>
